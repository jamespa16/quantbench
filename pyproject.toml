[project]
name = "quantbench"
version = "0.1.0"
description = "Benchmark every GGUF quantization in a Hugging Face repo against HumanEval+"
readme = "README.md"
authors = [
    { name = "James Palmer", email = "james.pa@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "evalplus>=0.3.1",
    "huggingface-hub>=1.23.0",
    "matplotlib>=3.11.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scipy>=1.14.0",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
]

[project.scripts]
quantbench = "quantbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
warn_unreachable = true
ignore_missing_imports = true
check_untyped_defs = false
