[project]
name = "quantbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Palmer", email = "james.pa@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "evalplus>=0.3.1",
    "huggingface-hub>=1.23.0",
    "matplotlib>=3.11.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scipy>=1.14.0",
    "tqdm>=4.68.4",
]

[project.scripts]
quantbench = "quantbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
